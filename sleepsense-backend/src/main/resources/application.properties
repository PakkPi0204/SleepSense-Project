server.port=8080

# Firebase
firebase.credentials.path=src/main/resources/firebase-service-account.json
firebase.database.url=https://your-project-id-default-rtdb.firebaseio.com

# CORS (so the Flutter app can call in)
cors.allowed.origins=*

# Logging
logging.level.com.sleepsense=DEBUG

# Thresholds (values appropriate for sleep)
# Sources: ASHRAE thermal comfort, WHO Night Noise Guidelines, US EPA AQI (PM2.5),
# the ASHRAE 30-60% RH comfort band, and CO2/cognitive-performance research (Satish et al.)

# CO2 (ppm) — above 1000 people get drowsy; above 2000 concentration is clearly affected
threshold.co2.warning=1000
threshold.co2.critical=2000

# Temperature (°C) — 20-24 is ideal for sleep; warning outside 18-26;
# critical once it is cold or hot enough to affect health.
# Note: this room runs with AC on some nights and a fan or open window on others.
# 30-31°C on a fan-only night is normal in Thailand, so critical.max sits at 32°C
# to avoid constant alerts. Hitting 32°C with the AC running does mean it has failed.
threshold.temperature.min=18.0
threshold.temperature.max=26.0
threshold.temperature.critical.min=15.0
threshold.temperature.critical.max=32.0

# Humidity (%) — 30-60 is the ASHRAE comfort band. Critical when very dry (<20,
# irritating to the airways) or very damp (>70, mould and dust-mite risk).
threshold.humidity.min=30.0
threshold.humidity.max=60.0
threshold.humidity.critical.min=20.0
threshold.humidity.critical.max=70.0

# PM2.5 (µg/m³, close to US EPA AQI breakpoints) — 35 = Unhealthy for Sensitive Groups;
# 75 = Unhealthy: close the windows and run an air purifier straight away.
threshold.pm25.warning=35.0
threshold.pm25.critical=75.0

# Light (lux) — a bedroom should be dark (<5 lux is best). Above 50 sleep starts to
# suffer (light leaking in, or too strong a nightlight); above 200 is main-light bright.
threshold.light.max=50.0
threshold.light.critical=200.0

# Noise (dB(A)) — the WHO recommends under 30-40dB for a bedroom. Warning was moved
# from 35 to 40 to cut false alarms: an ordinary fan or AC already reaches 35dB.
# Critical at 60dB, about conversation or TV volume, is loud enough to genuinely disturb sleep.
threshold.noise.warning=40.0
threshold.noise.critical=60.0

# Data cleanup (old records are removed automatically)
cleanup.retention.days=30
cleanup.batch.size=400
