server.port=8080

# Firebase
firebase.credentials.path=src/main/resources/firebase-service-account.json
firebase.database.url=https://your-project-id-default-rtdb.firebaseio.com

# CORS (รองรับ Flutter app)
cors.allowed.origins=*

# Logging
logging.level.com.sleepsense=DEBUG

# Thresholds (ค่าที่เหมาะสมสำหรับการนอนหลับ)
# อ้างอิง: ASHRAE thermal comfort, WHO Night Noise Guidelines, US EPA AQI (PM2.5),
# ASHRAE 30–60% RH comfort band, และงานวิจัย CO2/cognitive performance (Satish et al.)

# CO2 (ppm) — >1000 เริ่มง่วง/มึน, >2000 กระทบสมาธิ/สติชัดเจน
threshold.co2.warning=1000
threshold.co2.critical=2000

# Temperature (°C) — 20-24 เหมาะสมที่สุดสำหรับการนอน, warning นอกช่วง 18-26,
# critical เมื่อหนาว/ร้อนถึงระดับกระทบสุขภาพ
# หมายเหตุ: ห้องนี้บางคืนเปิดแอร์ บางคืนใช้พัดลม/เปิดหน้าต่าง — 30-31°C จากคืนไม่เปิดแอร์
# ถือเป็นเรื่องปกติในไทย จึงตั้ง critical.max ไว้ที่ 32°C กันไม่ให้เตือนถี่เกินจริง
# (ถ้าเปิดแอร์อยู่แล้วขึ้น 32°C แปลว่าแอร์เสียจริง ควรเตือนวิกฤต)
threshold.temperature.min=18.0
threshold.temperature.max=26.0
threshold.temperature.critical.min=15.0
threshold.temperature.critical.max=32.0

# Humidity (%) — 30-60 คือช่วงสบายตาม ASHRAE, critical เมื่อแห้งจัด (<20, ระคายเคือง
# ทางเดินหายใจ) หรือชื้นจัด (>70, เสี่ยงเชื้อรา/ไรฝุ่น)
threshold.humidity.min=30.0
threshold.humidity.max=60.0
threshold.humidity.critical.min=20.0
threshold.humidity.critical.max=70.0

# PM2.5 (µg/m³, ใกล้เคียง US EPA AQI breakpoints) — 35=Unhealthy for Sensitive Groups,
# 75=เข้าเขต Unhealthy ควรปิดหน้าต่าง+เปิดเครื่องฟอกอากาศทันที
threshold.pm25.warning=35.0
threshold.pm25.critical=75.0

# Light (lux) — ห้องนอนควรมืด (<5 lux ดีที่สุด), >50 เริ่มรบกวนการหลับ (มีแสงรั่ว/nightlight
# แรงเกินไป), >200 คือสว่างเทียบเท่าเปิดไฟหลัก ไม่เหมาะกับการนอนเลย
threshold.light.max=50.0
threshold.light.critical=200.0

# Noise (dB(A)) — WHO แนะนำ <30-40dB สำหรับห้องนอน, ปรับ warning จาก 35→40 เพื่อลด
# false alarm จากเสียงพัดลม/แอร์ทั่วไปที่เดินเบาๆ ก็แตะ 35dB ได้แล้ว
# critical 60dB = เทียบเท่าเสียงคุยกันปกติ/ทีวี ดังพอจะรบกวนการหลับจริง
threshold.noise.warning=40.0
threshold.noise.critical=60.0

# Data cleanup (ลบข้อมูลเก่าอัตโนมัติ)
cleanup.retention.days=30
cleanup.batch.size=400
